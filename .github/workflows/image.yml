name: image

# Full macOS chain for the Xiaomi Pad 8 Pro (piano) port:
# kernel -> package -> firmware -> payload -> boot image, published to a Release.

on:
  workflow_dispatch:
    inputs:
      seed:
        description: 'platform seed for the ADT (hex)'
        default: '0x0123456789abcdef'
        required: true
      jobs:
        description: 'parallel jobs'
        default: '4'
      bringup:
        description: 'bring-up profile: skip the owner-root/verified-root path that needs the original OS image and a Data seed'
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  image:
    runs-on: macos-26
    timeout-minutes: 360
    env:
      UNIXNU_UNIQUE_CHIP_ID: ${{ inputs.seed }}
      HOMEBREW_NO_AUTO_UPDATE: '1'
      DEVICE_ARGS: '--local-drivers ../UniXNU-device/modules/Pagani/drivers --local-kits ../UniXNU-device/modules/Pagani/kits'
      OUT: out/piano/ipados-17.7.11-21H461/piano
    steps:
      - name: checkout this repository (build inputs)
        uses: actions/checkout@v4
        with:
          path: ci

      - name: checkout UniXNU main fork
        uses: actions/checkout@v4
        with:
          repository: IssacL04/UniXNU_Enc3l
          path: UniXNU
          submodules: recursive

      - name: checkout device repository
        uses: actions/checkout@v4
        with:
          repository: xiaomi-pad-8-pro-development/android_device_xiaomi_piano-unixnu
          path: UniXNU-device
          submodules: recursive

      - name: checkout firmware repository and its Mu-Silicium dependencies
        uses: actions/checkout@v4
        with:
          repository: xiaomi-pad-8-pro-development/android_device_xiaomi_piano-uefi
          path: piano-uefi
          ref: unixnu

      - name: install tools
        run: |
          brew install dtc llvm lld cmake mtools lzfse nasm
          bash piano-uefi/tools/setup-deps.sh

      - name: show host
        run: |
          sw_vers
          xcodebuild -version
          echo "cpus: $(sysctl -n hw.ncpu) arch: $(uname -m)"

      - name: local build configuration
        working-directory: UniXNU
        run: |
          cat > unixnu.local.toml <<EOF
          [build]
          device = "../UniXNU-device"
          uefi = "../piano-uefi/deps/Mu-Silicium"
          dtb = "$GITHUB_WORKSPACE/ci/inputs/piano-live.dtb"
          jobs = ${{ inputs.jobs }}
          target = "DEBUG"
          EOF
          cat unixnu.local.toml

      - name: defconfig
        working-directory: UniXNU
        run: |
          ./unixnu defconfig piano_defconfig -D ../UniXNU-device $DEVICE_ARGS

      - name: bring-up profile
        if: ${{ inputs.bringup == true }}
        working-directory: UniXNU
        run: |
          for k in CONFIG_XNU_VERIFIED_ROOT_PROBE CONFIG_XNU_OWNER_ROOT_AUDIT CONFIG_XNU_OWNER_ROOT_TRUST \
                   CONFIG_XNU_OWNER_CACHE_MOUNT CONFIG_XNU_OWNER_CACHE_STARTUP CONFIG_XNU_OWNER_BOOT_MANIFEST \
                   CONFIG_XNU_OWNER_UNION_SYSTEMOS CONFIG_XNU_OWNER_DATA_MOUNT; do
            sed -i '' "s/^$k=y/# $k is not set/" "$OUT/.config"
          done
          sed -i '' 's|^CONFIG_XNU_VERIFIED_ROOT_ARCHIVE=.*|# CONFIG_XNU_VERIFIED_ROOT_ARCHIVE is not set|' "$OUT/.config"
          python3 - ../UniXNU-device/board.toml <<'PY'
          import sys
          p = sys.argv[1]
          s = open(p).read()
          s = s.replace('  "build-pagani-verified-root-probe.py --component os --include-systemos",\n', '')
          open(p, 'w').write(s)
          PY

      - name: port overlays
        working-directory: UniXNU
        run: |
          for f in "$GITHUB_WORKSPACE"/ci/overlay/scripts/*.py; do
            cp -v "$f" ../UniXNU-device/scripts/
          done

      - name: status
        working-directory: UniXNU
        run: |
          ./unixnu status --json -D ../UniXNU-device $DEVICE_ARGS | tee status.json

      - name: fetch sources
        working-directory: UniXNU
        run: |
          ./unixnu fetch

      - name: fetch IPSW components
        working-directory: UniXNU
        run: |
          ./unixnu ipsw fetch -D ../UniXNU-device $DEVICE_ARGS

      - name: trust cache bundle
        working-directory: UniXNU
        run: |
          # board.toml pins trust_cache_sha256 = 7416ca4f..., which is the bundle of the
          # static and the SystemOS cryptex trust cache of iPad7,1 21H461.
          python3 scripts/bundle-ipsw-trust.py "$GITHUB_WORKSPACE/piano-trust.bundle" \
            out/ipsw/21H461/044-76040-038.dmg.trustcache \
            out/ipsw/21H461/044-76034-038.dmg.trustcache
          sha256sum "$GITHUB_WORKSPACE/piano-trust.bundle"

      - name: board kit overlay
        working-directory: UniXNU
        run: |
          # The community peripheral/display recipes hard-code the 13T board kit
          # (kits/oneplus13t/PaganiPeripherals.h). This port has no package/ board kit
          # yet, so the bring-up build supplies the 13T header as a stand-in: it compiles
          # and gives the legacy display path a place to land, but its touch/panel/PMIC
          # constants are PKX110 values and must be replaced with piano ones.
          ./unixnu tree -D ../UniXNU-device $DEVICE_ARGS
          mkdir -p "$OUT/tree/kits/oneplus13t"
          cp -v "$GITHUB_WORKSPACE/ci/overlay/PaganiPeripherals.h" "$OUT/tree/kits/oneplus13t/"
      - name: build kernel
        working-directory: UniXNU
        run: |
          ./unixnu build kernel -D ../UniXNU-device $DEVICE_ARGS

      - name: build package
        working-directory: UniXNU
        run: |
          ./unixnu build package -D ../UniXNU-device $DEVICE_ARGS

      - name: build firmware
        working-directory: UniXNU
        run: |
          ./unixnu build firmware -D ../UniXNU-device --uefi ../piano-uefi/deps/Mu-Silicium $DEVICE_ARGS

      - name: build payload
        working-directory: UniXNU
        run: |
          ./unixnu build payload -D ../UniXNU-device $DEVICE_ARGS \
            --unique-chip-id "$UNIXNU_UNIQUE_CHIP_ID" \
            --trust-cache "$GITHUB_WORKSPACE/piano-trust.bundle" \
            --dtb "$GITHUB_WORKSPACE/ci/inputs/piano-live.dtb"

      - name: pack boot image
        working-directory: UniXNU
        run: |
          ./unixnu bootimg -D ../UniXNU-device --uefi ../piano-uefi/deps/Mu-Silicium \
            --dtb "$GITHUB_WORKSPACE/ci/inputs/piano-live.dtb"

      - name: collect results
        if: always()
        working-directory: UniXNU
        run: |
          mkdir -p "$GITHUB_WORKSPACE/out-image"
          for f in $OUT/kernel/kernel.macho $OUT/kernel/kernel.macho.adt \
                   $OUT/payload/payload.img $OUT/payload/payload.json \
                   $OUT/boot/boot.img $OUT/boot/boot.json \
                   $OUT/package/Build/Out/AARCH64-DEBUG/UniXNU.efi \
                   ../piano-uefi/deps/Mu-Silicium/Build/pianoPkg/DEBUG_CLANGPDB/FV/SILICIUM_UEFI.fd \
                   "$GITHUB_WORKSPACE/piano-trust.bundle"; do
            [ -f "$f" ] && cp -v "$f" "$GITHUB_WORKSPACE/out-image/" || true
          done
          cp -v status.json "$GITHUB_WORKSPACE/out-image/" || true
          (cd "$GITHUB_WORKSPACE/out-image" && sha256sum * > SHA256SUMS.txt) || true
          ls -l "$GITHUB_WORKSPACE/out-image"

      - name: publish release
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="image-${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" \
            --title "piano image ${GITHUB_RUN_NUMBER}" \
            --notes "seed ${{ inputs.seed }}, bringup ${{ inputs.bringup }}, commit ${GITHUB_SHA:0:7}" || true
          gh release upload "$TAG" "$GITHUB_WORKSPACE"/out-image/* --repo "$GITHUB_REPOSITORY" --clobber || true

      - name: upload workflow artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: piano-image
          if-no-files-found: warn
          retention-days: 3
          path: |
            out-image/**
            UniXNU/out/piano/*/*/logs/**
