name: data-seed

# The Data seed is installation state and can only be made where APFS can be formatted:
# make-data-seed.py drives hdiutil + newfs_apfs and then seed-data-grow.py. Linux has no mkfs.apfs,
# so this job publishes the DBRDISK1 seed the owner-Data kernel boots with.
on:
  workflow_dispatch:
    inputs:
      gib:
        description: 'Logical size of the Data volume'
        default: '4'
      build:
        description: 'iOS build stamped into the migration state'
        default: '21H461'
  push:
    paths:
      - '.github/workflows/data-seed.yml'

permissions:
  contents: write

jobs:
  seed:
    runs-on: macos-26
    timeout-minutes: 120
    steps:
      - name: Check out the port
        uses: actions/checkout@v4
        with:
          repository: IssacL04/UniXNU_Enc3l
          path: unixnu
          fetch-depth: 1

      # make-data-seed.py imports packed_ramdisk from the drivers tree, which the port does not
      # track: it ships with the Pagani drivers repository (pinned to the feed revision the
      # piano build uses).
      - name: Check out the drivers repository
        uses: actions/checkout@v4
        with:
          repository: IssacL04/UniXNU-Pagani-Drivers
          path: drivers
          ref: c888efd3ce1b817d13f28783a77cf689cb2255c9
          fetch-depth: 1

      - name: Fetch the 17.7.11 restore image
        run: |
          set -euo pipefail
          curl -L --retry 3 --retry-delay 5 -o restore.ipsw \
            "https://updates.cdn-apple.com/2025SpringFCS/fullrestores/122-77166/DCA6CFE8-90E9-4B92-880D-3DE171798E40/iPad_Pro_HFR_17.7.11_21H461_Restore.ipsw"
          unzip -o restore.ipsw "044-76040-038.dmg"
          ls -l 044-76040-038.dmg

      - name: Build the Data seed
        run: |
          set -euo pipefail
          export PYTHONPATH="$PWD/drivers/drivers/PaganiDarwinBoot/Test:${PYTHONPATH:-}"
          mkdir -p os-mnt unixnu/build
          # Create the Data image at its final size and drop the separate grow step: the grow path
          # attaches a raw file and asks diskutil for a container on it, which does not resolve on
          # current macOS runners ("No APFS container found on the attached seed").
          python3 - <<'PY'
          import pathlib
          path = pathlib.Path('unixnu/scripts/make-data-seed.py')
          text = path.read_text()
          created = "        subprocess.run(['hdiutil', 'create', '-size', '32m', '-layout', 'NONE', '-fs', 'APFS',"
          if created not in text:
              raise SystemExit('create call not found')
          text = text.replace(created,
                              "        subprocess.run(['hdiutil', 'create', '-size', f'{args.gib}g', '-layout', 'NONE', '-fs', 'APFS',", 1)
          grow = ("        base = work / 'base.dbr'\n"
                  "        packed_ramdisk.pack(raw, base)\n"
                  "        candidate = work / 'data.dbr'\n"
                  "        subprocess.run([sys.executable, ROOT / 'scripts/seed-data-grow.py', '--gib', str(args.gib), base, candidate], check=True)\n"
                  "        candidate.replace(args.output)\n")
          if grow not in text:
              raise SystemExit('grow call not found')
          text = text.replace(grow,
                              "        candidate = work / 'data.dbr'\n"
                              "        packed_ramdisk.pack(raw, candidate)\n"
                              "        candidate.replace(args.output)\n", 1)
          path.write_text(text)
          print('make-data-seed.py creates the image at its final size')
          PY
          hdiutil attach -nobrowse -readonly -mountpoint "$PWD/os-mnt" 044-76040-038.dmg
          ls os-mnt | head
          python3 unixnu/scripts/make-data-seed.py os-mnt data.dbrdisk \
            --gib "${{ inputs.gib || '4' }}" --build "${{ inputs.build || '21H461' }}" --skip-setup
          hdiutil detach "$PWD/os-mnt" || true
          ls -l data.dbrdisk
          shasum -a 256 data.dbrdisk | tee data.dbrdisk.sha256

      - name: Upload the seed as a workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: data-seed
          path: |
            data.dbrdisk
            data.dbrdisk.sha256
          if-no-files-found: error

      - name: Publish the seed to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view data-seed >/dev/null 2>&1 || \
            gh release create data-seed --title "Data seed" --notes "APFS Data seed (DBRDISK1) for the piano iPadOS bring-up"
          gh release upload data-seed data.dbrdisk data.dbrdisk.sha256 --clobber
